name = "ag_nonsense"
version = "0.1.0"
keywords = ["math", "algebraic-geometry"]
defaultTargets = ["AGNonsense"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "4bc4670bf916c8dc2ede840e3ead86301e52a40d"

[[lean_lib]]
name = "AGNonsense"
